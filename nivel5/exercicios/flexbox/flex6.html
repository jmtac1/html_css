<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox 6</title>
    <style>
        .conteiner {
            display: flex;
            background-color: teal;
        }
        .item {
            background-color: coral;
            border: 1px solid black;
            text-align: center;
            padding: 10px;
        }
        #i0 {
            order: -2;
        }
        #i1 {
            order: 3;
        }
        #i2 {
            order: 0;
        }
        #i3 {
            order: -1;
        }
        #i4 {
            order: 0;
        }
        #i5 {
            order: 1;
        }
        #i6 {
            order: -3;
        }
    </style>
</head>
<body>
    <h1>order: -2, 3, 0, -1, 0, 1, -3</h1>
    <div class="conteiner">
        <div class="item" id="i0">A</div>
        <div class="item" id="i1">B</div>
        <div class="item" id="i2">C</div>
        <div class="item" id="i3">D</div>
        <div class="item" id="i4">E</div>
        <div class="item" id="i5">F</div>
        <div class="item" id="i6">G</div>
    </div>
</body>
</html>
