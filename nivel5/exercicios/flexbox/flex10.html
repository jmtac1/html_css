<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox 10</title>
    <style>
        .conteiner {
            display: flex;
            flex-flow: row nowrap;
            background-color: teal;
        }
        .item {
            background-color: coral;
            border: 1px solid black;
            text-align: center;
            padding: 10px;
        }
        .item1 {
            background-color: coral;
            border: 1px solid black;
            text-align: center;
            padding: 10px;
            flex: initial;
        }
        .item2 {
            background-color: coral;
            border: 1px solid black;
            text-align: center;
            padding: 10px;
            flex: none;
        }
        .item3 {
            background-color: coral;
            border: 1px solid black;
            text-align: center;
            padding: 10px;
            flex: auto;
        }
        #item1 {
            flex: 1 1 300px;
        }
        #item2 {
            flex: 10 0 300px;
        }
        #item3 {
            flex: 0 10 300px;
        }
    </style>
</head>
<body>
    <h1>flex = flex-grow + flex-shrink + flex-basis</h1>
    <h2>(A: flex: 1 1 300px) (B: flex: 10 0 300px) (C: flex: 0 10 300px)</h2>
    <div class="conteiner">
        <div class="item" id="item1">A</div>
        <div class="item" id="item2">B</div>
        <div class="item" id="item3">C</div>
    </div>
    <h1>flex: initial</h1>
    <div class="conteiner">
        <div class="item1">A</div>
        <div class="item1">B</div>
        <div class="item1">C</div>
    </div>
    <h1>flex: none</h1>
    <div class="conteiner">
        <div class="item2">A</div>
        <div class="item2">B</div>
        <div class="item2">C</div>
    </div>
    <h1>flex: auto</h1>
    <div class="conteiner">
        <div class="item3" >A</div>
        <div class="item3" >B</div>
        <div class="item3" >C</div>
    </div>
</body>
</html>
