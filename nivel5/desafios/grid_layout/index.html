<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid layout</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 1.1em;
        }
        .container {
            display: grid;
            border: 2px solid black;
            grid-template: 2fr 1fr 6fr 1fr / 7fr 3fr;
            gap: 5px;
            width: 100vw;
            height: 100vh;
        }
        .topo {
            grid-area: 1 / 1 / 2 / 3;
            background-color: aqua;
            border: 2px solid black;
            text-align: center;
        }
        .menu {
            grid-area: 2 / 1 / 3 / 3;
            background-color:chartreuse;
            border: 2px solid black;
            text-align: center;
        }
        .principal {
            grid-area: 3 / 1 / 4 / 2;
            background-color: cadetblue;
            border: 2px solid black;
            text-align: center;
        }
        .secundario {
            background-color: chocolate;
            border: 2px solid black;
            text-align: center;
        }
        .rodape {
            grid-area: 4 / 1 / 5 / 3;
            background-color: bisque;
            border: 2px solid black;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="topo">topo</div>
        <div class="menu">menu</div>
        <div class="principal">principal</div>
        <div class="secundario">secundario</div>
        <div class="rodape">rodape</div>
    </div>
</body>
</html>
